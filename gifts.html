<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>night gifts</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,500;1,600&family=IBM+Plex+Mono:wght@400&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
:root{--gt:16.6vh;--gb:70.6vh;--cool:170,190,255;--warm:255,186,120}
.L{position:absolute;pointer-events:none}
canvas{position:absolute;inset:0}
.name{font-family:'Lora',Georgia,serif;font-style:italic;color:#f5f3ff;text-align:center;
  text-shadow:0 0 10px rgba(var(--cool),.6),0 0 28px rgba(var(--cool),.35),0 2px 5px rgba(0,0,0,.95);opacity:0;transition:opacity 1.2s ease}
.small{font-family:'IBM Plex Mono',monospace;font-size:1.25vh;letter-spacing:.32em;text-transform:lowercase;color:rgba(230,234,255,.75);
  text-shadow:0 1px 3px rgba(0,0,0,.9);opacity:0;transition:opacity 1.2s ease;text-align:center;white-space:nowrap}
.on{opacity:1!important}
.hand{font-family:'Caveat',cursive;font-size:4.2vh;color:rgba(255,255,255,.88);
  text-shadow:0 0 6px rgba(255,255,255,.5),0 0 18px rgba(var(--cool),.35);white-space:nowrap;
  clip-path:inset(0 100% 0 0);transition:clip-path 1.8s ease, opacity 1.5s ease}
.hand.write{clip-path:inset(0 0 0 0)}
.av{border-radius:50%;overflow:hidden;opacity:0;transform:scale(.6);transition:opacity 1.2s ease,transform 1.6s cubic-bezier(.2,.9,.2,1);
  box-shadow:0 0 0 2px rgba(255,255,255,.75),0 0 18px rgba(var(--cool),.8),0 0 44px rgba(var(--cool),.45);background:#1a2238}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av .ini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Lora',serif;font-style:italic;color:#fff;font-size:150%}
.av.on{opacity:1;transform:scale(1)}
.av.warm{box-shadow:0 0 0 2px rgba(255,236,214,.85),0 0 18px rgba(var(--warm),.8),0 0 44px rgba(var(--warm),.45)}
#menu{left:0;right:0;top:calc(var(--gb) + 1.1vh);}
#menu span{color:#ffe2c2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="L small" id="menu"></div>
<div class="L" id="fx" style="inset:0"></div>
<script>
/* ============ settings ============
   ?gt=16.6 ?gb=70.6     game window (% of height)
   ?ws=ws://localhost:21213   TikFinity WebSocket (default) ; ?ws=0 to disable
   ?demo=rose|stars|butterfly|galaxy|all     preview effects
   ?menu=0               hide the rotating gift guide
=================================== */
const P=new URLSearchParams(location.search),num=(k,d)=>{const v=parseFloat(P.get(k));return isNaN(v)?d:v};
const GT=num('gt',16.6)/100, GB=num('gb',70.6)/100;
document.documentElement.style.setProperty('--gt',GT*100+'vh');document.documentElement.style.setProperty('--gb',GB*100+'vh');
const cv=document.getElementById('c'),cx=cv.getContext('2d'),fx=document.getElementById('fx');
let W,H;function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio}size();addEventListener('resize',size);
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- gift guide: one line, rotating, under the title ---------- */
const MENU=[
 ['🌹 rose','your name, written on the glass'],
 ['✨ stars snap','light up the night sky'],
 ['🦋 butterfly','a firefly carries your name'],
 ['🌌 galaxy','the whole sky is yours'],
];
const menu=document.getElementById('menu');let mi=0;
function menuTick(){ if(P.get('menu')==='0')return; menu.classList.remove('on');
  setTimeout(()=>{const m=MENU[mi++%MENU.length];menu.innerHTML=`<span>${m[0]}</span> &nbsp;·&nbsp; ${m[1]}`;menu.classList.add('on')},1300);}
menuTick();setInterval(menuTick,7000);

/* ---------- particle engine on canvas ---------- */
let parts=[];
function glow(x,y,r,c,a){const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(1,`rgba(${c},0)`);cx.fillStyle=g;cx.fillRect(x-r,y-r,2*r,2*r)}
function loop(t){cx.clearRect(0,0,W,H);const now=performance.now();
  parts=parts.filter(p=>now<p.end);for(const p of parts)p.draw(now,(now-p.start)/(p.end-p.start));requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function add(dur,draw,delay=0){const s=performance.now()+delay;parts.push({start:s,end:s+dur,draw:(n,q)=>{if(q>=0)draw(q)}})}
function text(cls,html,css,life){const d=document.createElement('div');d.className='L '+cls;d.innerHTML=html;Object.assign(d.style,css);fx.appendChild(d);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{d.classList.add('on');if(cls.includes('hand'))d.classList.add('write')}));
  setTimeout(()=>{d.classList.remove('on');d.style.opacity=0},life-1500);setTimeout(()=>d.remove(),life);return d}
function avatar(pic,name,vh,css,life,warm){const d=document.createElement('div');d.className='L av'+(warm?' warm':'');
  Object.assign(d.style,{width:vh+'vh',height:vh+'vh',fontSize:(vh*.45)+'vh'},css);
  const ini=`<div class="ini">${esc(name).replace('@','').charAt(0).toUpperCase()||'✦'}</div>`;
  d.innerHTML=pic?`<img src="${pic}" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML='${ini.replace(/"/g,'&quot;')}'">`:ini;
  fx.appendChild(d);requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('on')));
  setTimeout(()=>d.classList.remove('on'),life-1300);setTimeout(()=>d.remove(),life);return d}
const esc=s=>String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])).slice(0,22);

/* ---------- 1. rose: fog on the glass + handwritten name ---------- */
function rose(name,pic){
  const x=W*.72,y=H*(GT+.07);
  add(6000,q=>{const a=Math.sin(Math.PI*Math.min(q*1.3,1))*.22;glow(x,y,W*.22,'235,240,255',a);
    const d=Math.max(0,q-.35)/.65; glow(x+W*.05,y+H*.02+d*H*.12,W*.012,'255,255,255',.5*(1-d)); }); // fog + one drop sliding
  add(900,q=>glow(x,y,W*.35,'255,200,170',.12*Math.sin(Math.PI*q)));                                  // warm breath
  avatar(pic,name,5.5,{left:'58%',top:`calc(${(GT+.035)*100}vh)`},6000,true);
  text('hand',`for ${esc(name)}`,{left:'52%',top:`calc(${(GT+.075)*100}vh)`,width:'40%',textAlign:'center'},6000);
}
/* ---------- 2. stars snap: the sky lights up, star by star ---------- */
function stars(name,pic){
  const n=46;for(let i=0;i<n;i++){const x=rnd(.04,.96)*W,y=rnd(.02,GT-.03)*H,r=rnd(1.5,3.2)*devicePixelRatio,d=i*45;
    add(6200-d,q=>{const a=Math.min(q*6,1)*(1-Math.max(0,q-.7)/.3);glow(x,y,r*5,'200,215,255',.25*a);cx.fillStyle=`rgba(255,255,255,${.9*a})`;cx.fillRect(x-r/2,y-r/2,r,r)},d)}
  avatar(pic,name,6.5,{left:'calc(50% - 3.25vh)',top:`calc(${GT*30}vh)`},6500);
  text('small',`${esc(name)} lit the sky`,{left:0,right:0,top:`calc(${GT*30+7.6}vh)`},6500);
}
/* ---------- 3. butterfly: a firefly drifts through the dark, carrying the name ---------- */
function butterfly(name,pic){
  const pts=[[-.05,GB+.16],[.35,GB+.09],[.7,GB+.13],[.985,GB-.02],[.985,GT+.05],[.75,GT-.07],[.4,GT-.10],[-.05,GT-.06]];
  const path=q=>{const s=q*(pts.length-1),i=Math.min(Math.floor(s),pts.length-2),f=s-i,e=f*f*(3-2*f);
    return [ (pts[i][0]+(pts[i+1][0]-pts[i][0])*e)*W, (pts[i][1]+(pts[i+1][1]-pts[i][1])*e)*H ]};
  const trail=[];while(trail.length>90)trail.shift();
  add(7000,q=>{const [x,y]=path(q);trail.push([x,y,performance.now()]);if(trail.length>90)trail.shift();
    for(const t of trail){const age=(performance.now()-t[2])/1400;if(age<1)glow(t[0],t[1],7*devicePixelRatio,'255,214,160',.16*(1-age))}
    const flap=.6+.4*Math.sin(performance.now()/90);glow(x,y,26*devicePixelRatio,'255,200,140',.35);glow(x,y,8*devicePixelRatio*flap,'255,245,225',.9)});
  avatar(pic,name,7,{left:'calc(50% - 3.5vh)',top:`calc(${(GB+.045)*100}vh)`},7500,true);
  text('name',esc(name),{left:0,right:0,top:`calc(${(GB+.045)*100+8}vh)`,fontSize:'2.8vh'},7500);
}
/* ---------- 4. galaxy: the sky opens ---------- */
function galaxy(name,pic){
  add(10500,q=>{const a=Math.sin(Math.PI*q);cx.fillStyle=`rgba(3,5,14,${.35*a})`;cx.fillRect(0,0,W,GT*H);cx.fillRect(0,GB*H,W,H-GB*H);
    for(let i=0;i<14;i++){const u=i/13;glow(W*(-.1+1.2*u),H*(GT*.55+.06*Math.sin(u*5)),W*.16,i%3?'150,170,255':'210,150,255',.10*a)}});
  for(let k=0;k<7;k++){const d=600+k*900,y0=rnd(.0,GT*.6)*H,x0=rnd(.6,1.1)*W;
    add(1600,q=>{const x=x0-q*W*.7,y=y0+q*H*.08;for(let s=0;s<22;s++){const u=s/22;glow(x+u*70*devicePixelRatio,y-u*9*devicePixelRatio,(4-u*3)*devicePixelRatio,'230,240,255',(1-u)*.9*Math.sin(Math.PI*q))}},d)}
  const sp=[];for(let i=0;i<120;i++)sp.push([rnd(0,1)*W,rnd(0,GT)*H,rnd(.5,2)*devicePixelRatio]);
  add(10500,q=>{const a=Math.sin(Math.PI*q);for(const s of sp){cx.fillStyle=`rgba(255,255,255,${a*.8*(.5+.5*Math.sin(performance.now()/300+s[0]))})`;cx.fillRect(s[0],s[1],s[2],s[2])}});
  avatar(pic,name,10,{left:'calc(50% - 5vh)',top:`calc(${GT*100/2-6.5}vh)`},10500);
  text('name',esc(name),{left:0,right:0,top:`calc(${GT*100/2+4}vh)`,fontSize:'3.6vh'},10500);
  text('small','the night is yours',{left:0,right:0,top:`calc(${GB*100+4}vh)`},10500);
}
const FX={rose,stars,butterfly,galaxy};

/* ---------- queue so effects never pile up ---------- */
const Q=[];let busy=false;const LEN={rose:5000,stars:5500,butterfly:6500,galaxy:10000};
function play(kind,name,pic){Q.push([kind,name,pic]);if(!busy)next()}
function next(){const it=Q.shift();if(!it){busy=false;return}busy=true;FX[it[0]](it[1],it[2]);setTimeout(next,LEN[it[0]])}

/* ---------- gift name -> effect ---------- */
function kindOf(g){g=(g||'').toLowerCase();
  if(g.includes('galaxy'))return'galaxy';if(g.includes('butterfly'))return'butterfly';
  if(g.includes('star'))return'stars';if(g.includes('rose'))return'rose';return null}

/* ---------- TikFinity WebSocket ---------- */
const WSURL=P.get('ws')||'ws://localhost:21213/';
function connect(){ if(WSURL==='0')return; let ws;try{ws=new WebSocket(WSURL)}catch(e){return setTimeout(connect,5000)}
  ws.onmessage=m=>{try{const j=JSON.parse(m.data);const ev=j.event||j.type;const d=j.data||j;
    if(ev!=='gift')return; if(d.giftType===1&&!d.repeatEnd)return;      // wait for the end of a streak
    const k=kindOf(d.giftName);if(k)play(k,d.nickname||d.uniqueId||'someone',d.profilePictureUrl||(d.userDetails&&d.userDetails.profilePictureUrls&&d.userDetails.profilePictureUrls[0])||'')}catch(e){}};
  ws.onclose=()=>setTimeout(connect,4000)}
connect();

/* ---------- demo ---------- */
const demo=P.get('demo');
if(demo==='all'){['rose','stars','butterfly','galaxy'].forEach(k=>play(k,'@sarah_92'))}else if(demo&&FX[demo])play(demo,'@sarah_92');
</script>
</body>
</html>
